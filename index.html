<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>CodeSnippets - Share & Discover Code</title>
    <meta
      name="description"
      content="Discover, share, and reuse code snippets across your projects. Modern code snippet library with GitHub integration."
    />
    <meta name="author" content="CodeSnippets" />
    <meta name="color-scheme" content="light dark" />
    <!-- Dynamic theme-color for mobile address bar -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="CodeSnippets - Share & Discover Code" />
    <meta property="og:description" content="Modern code snippet library with GitHub integration" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@slowlyh" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Pre-hydration theme script (prevents flash and ignores any static class on <html>) -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          root.classList.remove("light", "dark");

          var stored = localStorage.getItem("theme");
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

          var dark = stored === "dark" || ((!stored || stored === "system") && prefersDark);
          if (dark) root.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>Enable JavaScript to run this app.</noscript>
  </body>
</html>
